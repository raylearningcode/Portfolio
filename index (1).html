<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO (MD §19) ── -->
    <title>Rafi | Cybersecurity Student & Security Tooling Portfolio</title>
    <meta name="description" content="Portfolio of Rafi, a CS student focused on cybersecurity, Python security tools, CTF writeups, and full-stack development. Indonesia → Taiwan → Germany." />
    <meta name="keywords"    content="cybersecurity student, security engineer intern, python security tools, CTF writeups, web security portfolio, React portfolio" />
    <meta name="author"      content="Rafi" />
    <link rel="canonical"    href="https://rafi.dev" />

    <!-- ── Open Graph (for LinkedIn/Slack/WhatsApp previews) ── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://rafi.dev" />
    <meta property="og:title"       content="Rafi | Security Engineer in Progress" />
    <meta property="og:description" content="CS student building security tools, CTF writeups, and full-stack projects. Indonesia → Taiwan → Germany." />
    <meta property="og:image"       content="https://rafi.dev/og-image.png" />

    <!-- ── Twitter card ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Rafi | Security Engineer in Progress" />
    <meta name="twitter:description" content="CS student building security tools, CTF writeups, and full-stack projects." />
    <meta name="twitter:image"       content="https://rafi.dev/og-image.png" />

    <!-- ── Favicon (replace with your own in /public) ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── Google Fonts: JetBrains Mono + Inter + Fira Code ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Prevent flash of unstyled content */
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: #090d1f;
        color: #f0f4ff;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Hide scrollbar flash before React mounts */
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
